<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<title>Suivi</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icone-192.png">
<link rel="apple-touch-icon" href="./icone-192.png">
<style>
:root{
  color-scheme: light;
  --plane:#f9f9f7; --surface-1:#fcfcfb; --surface-2:#f3f2ee;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --series-1:#2a78d6; --series-2:#eb6834;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --shadow:0 1px 2px rgba(11,11,11,.05);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --plane:#0d0d0d; --surface-1:#1a1a19; --surface-2:#222221;
    --text-primary:#fff; --text-secondary:#c3c2b7; --text-muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --series-1:#3987e5; --series-2:#d95926;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0d0d0d; --surface-1:#1a1a19; --surface-2:#222221;
  --text-primary:#fff; --text-secondary:#c3c2b7; --text-muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --series-1:#3987e5; --series-2:#d95926;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--plane); color:var(--text-primary);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding:0 0 env(safe-area-inset-bottom);
}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 40px}

/* ---------- en-tête ---------- */
header{
  position:sticky; top:0; z-index:20; background:var(--plane);
  padding:calc(env(safe-area-inset-top) + 12px) 14px 10px;
  border-bottom:1px solid var(--border);
}
.head-in{max-width:760px;margin:0 auto;display:flex;align-items:flex-start;gap:10px}
h1{font-size:17px;font-weight:650;margin:0;letter-spacing:-.01em}
.sub{font-size:12.5px;color:var(--text-secondary);margin-top:2px}
.head-actions{margin-left:auto;display:flex;gap:6px;flex:0 0 auto}
button.icon{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface-1);color:var(--text-secondary);font-size:16px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
button.icon:active{background:var(--surface-2)}
.spin{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- cartes ---------- */
section{
  background:var(--surface-1);border:1px solid var(--border);border-radius:14px;
  padding:14px;margin-top:14px;box-shadow:var(--shadow);
}
h2{font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;
   color:var(--text-secondary);margin:0 0 12px}
h3{font-size:13px;font-weight:600;margin:18px 0 8px;color:var(--text-secondary)}

/* ---------- tuiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface-2);border-radius:11px;padding:11px 12px}
.tile.hero{grid-column:1/-1;background:var(--surface-2)}
.tile .lab{font-size:11.5px;color:var(--text-secondary);line-height:1.25;min-height:2.5em}
.tile .val{font-size:20px;font-weight:640;letter-spacing:-.02em;margin-top:5px}
.tile.hero .val{font-size:30px}
.tile .note{font-size:11px;color:var(--text-muted);margin-top:3px}
.meter{height:6px;border-radius:3px;background:var(--grid);margin-top:8px;overflow:hidden}
.meter>i{display:block;height:100%;border-radius:3px;background:var(--series-1)}

/* ---------- alertes ---------- */
.alert{display:flex;gap:9px;padding:9px 0;border-top:1px solid var(--border);font-size:13px}
.alert:first-child{border-top:0}
.dot{flex:0 0 auto;width:16px;height:16px;border-radius:50%;margin-top:2px;
     display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:700}
.dot.good{background:var(--good)} .dot.warning{background:var(--warning);color:#0b0b0b}
.dot.info{background:var(--axis);color:var(--text-primary)} .dot.critical{background:var(--critical)}
.alert .det{color:var(--text-muted);font-size:11.5px;margin-top:2px}

/* ---------- graphiques ---------- */
.chart{position:relative;width:100%;overflow:visible}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 8px;font-size:12px;color:var(--text-secondary)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:baseline}
.tip{
  position:absolute;pointer-events:none;opacity:0;transition:opacity .12s;
  background:var(--text-primary);color:var(--plane);border-radius:8px;
  padding:7px 9px;font-size:11.5px;line-height:1.35;white-space:nowrap;z-index:9;
  transform:translate(-50%,-100%);box-shadow:0 3px 10px rgba(0,0,0,.18)
}
.tip b{font-weight:600}
.axis-label{font-size:10px;fill:var(--text-muted)}
.tabular{font-variant-numeric:tabular-nums}

/* ---------- filtres ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters label{flex:1 1 44%;min-width:120px;font-size:11px;color:var(--text-muted)}
.filters label.large{flex:1 1 100%}
.filters select{
  width:100%;margin-top:3px;padding:8px 26px 8px 9px;font-size:13px;
  border:1px solid var(--border);border-radius:9px;background:var(--surface-2);
  color:var(--text-primary);appearance:none;font-family:inherit;
  background-image:linear-gradient(45deg,transparent 50%,var(--text-muted) 50%),linear-gradient(135deg,var(--text-muted) 50%,transparent 50%);
  background-position:calc(100% - 14px) 15px,calc(100% - 9px) 15px;background-size:5px 5px;background-repeat:no-repeat;
}

/* ---------- tableaux ---------- */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:6px 0;text-align:right;border-bottom:1px solid var(--border)}
th{font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
th:first-child,td:first-child{text-align:left}
td.num{font-variant-numeric:tabular-nums}
tr.tot td{font-weight:650;border-bottom:0}
.miniwrap{display:flex;align-items:center;gap:7px;justify-content:flex-end}
.mini{height:6px;border-radius:3px;background:var(--series-2);flex:0 0 auto}
.mini.rec{background:var(--series-1)}
details{margin-top:12px}
summary{font-size:12.5px;color:var(--series-1);cursor:pointer;padding:6px 0;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";display:inline-block;transition:transform .15s}
details[open] summary::before{content:"▾ "}
.rowline{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.rowline:last-child{border-bottom:0}
.rowline .k{color:var(--text-secondary)}
.rowline .v{font-variant-numeric:tabular-nums;font-weight:560;text-align:right;white-space:nowrap}
.rowline.strong .k{color:var(--text-primary);font-weight:600}
.rowline.strong .v{font-weight:650}
.note{font-size:11.5px;color:var(--text-muted);margin-top:10px;line-height:1.4}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:4px 9px;border-radius:999px;
       background:var(--surface-2);color:var(--text-secondary);border:1px solid var(--border)}
.badge .dot{width:8px;height:8px}
.v3-btn{display:inline-block;margin:6px 6px 0 0;padding:9px 14px;border:0;border-radius:9px;
  background:var(--series-1);color:#fff;font:inherit;font-size:13px;cursor:pointer}
.v3-btn[disabled]{opacity:.45;cursor:default}
.v3-fichier{display:inline-block;margin:6px 6px 0 0;padding:9px 14px;border-radius:9px;
  border:1px solid var(--series-1);color:var(--series-1);font-size:13px;cursor:pointer}
#v3-fichier{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.v3-h3{margin:16px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted)}
.v3-form{display:flex;flex-wrap:wrap;gap:6px}
.v3-form input,.v3-form select,#v3-jeton{padding:8px;border-radius:8px;border:1px solid var(--grid);
  background:var(--bg);color:var(--text);font:inherit;font-size:13px;min-width:130px;flex:1 1 130px}
.v3-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12.5px;border-bottom:1px solid var(--grid)}
.v3-row span{flex:1}
.v3-diff{margin-top:10px;padding:10px;border:1px solid var(--grid);border-radius:10px}
.v3-envoi{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:12.5px}
footer{margin:18px 4px 0;font-size:11.5px;color:var(--text-muted);text-align:center;line-height:1.6}
footer button{background:none;border:0;color:var(--series-1);font-size:11.5px;cursor:pointer;padding:0;font-family:inherit}
.skel{opacity:.45}
#erreur{display:none;background:var(--surface-1);border:1px solid var(--critical);border-radius:12px;
        padding:12px;margin-top:14px;font-size:13px}
@media (min-width:560px){ .tiles{grid-template-columns:repeat(3,1fr)} .tile.hero{grid-column:span 3} }

/* ---------- écran de déverrouillage ---------- */
#verrou{
  position:fixed; inset:0; z-index:60; background:var(--plane);
  display:none; align-items:center; justify-content:center;
  padding:calc(env(safe-area-inset-top) + 20px) 18px 20px;
}
#verrou.on{display:flex}
.coffre{
  width:100%; max-width:330px; text-align:center;
  background:var(--surface-1); border:1px solid var(--border);
  border-radius:16px; padding:26px 20px 22px; box-shadow:var(--shadow);
}
.coffre .cadenas{font-size:30px;line-height:1}
.coffre h2{margin:12px 0 4px;font-size:15px;text-transform:none;letter-spacing:0;color:var(--text-primary)}
.coffre p{margin:0 0 16px;font-size:12.5px;color:var(--text-secondary)}
.coffre input[type=password]{
  width:100%; padding:11px 12px; font-size:16px; font-family:inherit;
  border:1px solid var(--border); border-radius:10px;
  background:var(--surface-2); color:var(--text-primary); text-align:center;
}
.coffre .memo{display:flex;align-items:center;justify-content:center;gap:7px;
  margin:12px 0 4px;font-size:12px;color:var(--text-secondary)}
.coffre .memo input{width:16px;height:16px;accent-color:var(--series-1)}
.coffre button{
  width:100%; margin-top:12px; padding:11px; font-size:14.5px; font-weight:600;
  font-family:inherit; border:0; border-radius:10px;
  background:var(--series-1); color:#fff; cursor:pointer;
}
.coffre button:disabled{opacity:.55;cursor:progress}
.coffre .msg{margin-top:10px;font-size:12.5px;min-height:1.2em;color:var(--critical)}
.coffre .pied{margin-top:14px;font-size:11px;color:var(--text-muted);line-height:1.45}
</style>
</head>
<body>

<div id="verrou">
  <div class="coffre">
    <div class="cadenas" aria-hidden="true">🔒</div>
    <h2>Suivi protégé</h2>
    <p id="verrou-invite">Saisissez le mot de passe pour afficher les chiffres.</p>
    <input type="password" id="mdp" autocomplete="current-password" enterkeyhint="go"
           aria-label="Mot de passe" placeholder="mot de passe">
    <label class="memo"><input type="checkbox" id="retenir" checked>Rester déverrouillé sur cet appareil</label>
    <button id="btn-ouvrir">Déverrouiller</button>
    <div class="msg" id="verrou-msg" role="status"></div>
    <div class="pied">Les données sont chiffrées sur le serveur.<br>Le mot de passe ne quitte jamais ce téléphone.</div>
  </div>
</div>

<header>
  <div class="head-in">
    <div>
      <h1 id="titre">Suivi</h1>
      <div class="sub" id="soustitre">chargement…</div>
    </div>
    <div class="head-actions">
      <button class="icon" id="btn-verrouiller" title="Verrouiller" aria-label="Verrouiller" style="display:none">🔒</button>
      <button class="icon" id="btn-theme" title="Thème" aria-label="Changer de thème">◐</button>
      <button class="icon" id="btn-refresh" title="Actualiser" aria-label="Actualiser">⟳</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="erreur"></div>
  <main id="app" class="skel"></main>
  <footer>
    <div id="pied"></div>
    <div style="margin-top:6px">
      <a href="./publier.html">Publier une mise à jour</a> ·
      <button id="btn-vider">Vider le cache local</button>
    </div>
  </footer>
</div>

<script src="./engine.js"></script>
<script src="./xlsx.js"></script>
<script src="./donnees.js"></script>
<script src="./v3.js"></script>
<script>
/* ==========================================================================
   Application — affichage seul. Tous les calculs sont dans engine.js.
   ========================================================================== */
(function(){
'use strict';
var M = window.Moteur;
var CLE_DATA = 'immo.data.v1', CLE_THEME = 'immo.theme', CLE_FILTRES = 'immo.filtres';
var CLE_CLE = 'immo.cle.v1';
var data = null;                 // données en clair, utilisables (null tant que verrouillé)
var enveloppe = null;            // ce qui a été téléchargé (chiffré ou non)
var filtres = {annee:'Toutes', studio:'Tous', perimetre:'Toutes les dépenses'};

/* ---------- utilitaires ---------- */
var eur = M.fmtEur, dateFr = M.fmtDate;
function eur0(v){ if (v===null||v===undefined||isNaN(v)) return 'n/a'; var r = Math.round(v); if (r === 0) r = 0; return r.toLocaleString('fr-FR')+' €'; }
function pct(v,d){ return (v===null||v===undefined||isNaN(v)) ? 'n/a' : (v*100).toLocaleString('fr-FR',{minimumFractionDigits:d||0,maximumFractionDigits:d||0})+' %'; }
function el(tag, attrs, html){
  var e = document.createElement(tag);
  if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]);
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
var MOIS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
function moisCourt(ym){ return MOIS[+ym.slice(5,7)-1] + ' ' + ym.slice(2,4); }
function moisLong(ym){ return MOIS[+ym.slice(5,7)-1] + ' ' + ym.slice(0,4); }

/* ---------- thème ---------- */
function appliquerTheme(){
  var t = localStorage.getItem(CLE_THEME) || 'auto';
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  document.getElementById('btn-theme').textContent = t==='auto' ? '◐' : (t==='dark' ? '☾' : '☀');
}
document.getElementById('btn-theme').onclick = function(){
  var t = localStorage.getItem(CLE_THEME) || 'auto';
  var suivant = t==='auto' ? 'light' : (t==='light' ? 'dark' : 'auto');
  localStorage.setItem(CLE_THEME, suivant); appliquerTheme(); if (data) rendre();
};
appliquerTheme();

/* ==========================================================================
   COFFRE — déchiffrement du fichier publié.
   BLOC IDENTIQUE (aux fonctions de chiffrement près) DANS publier.html.
   Format : PBKDF2-SHA256 (sel + itérations publics) puis AES-GCM 256.
   L'enveloppe laisse en clair ce qui n'est pas confidentiel (date de
   publication, dépôt) pour pouvoir comparer les versions sans déverrouiller.
   ========================================================================== */
function b64u8(b){ var s = atob(b), u = new Uint8Array(s.length); for (var i=0;i<s.length;i++) u[i] = s.charCodeAt(i); return u; }
function u8b64(u){ var s = ''; for (var i=0;i<u.length;i++) s += String.fromCharCode(u[i]); return btoa(s); }
function deriverCle(motdepasse, selB64, iterations){
  var base = crypto.subtle.importKey('raw', new TextEncoder().encode(motdepasse), 'PBKDF2', false, ['deriveKey']);
  return base.then(function(k){
    return crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64u8(selB64), iterations:iterations, hash:'SHA-256'},
      k, {name:'AES-GCM', length:256}, true, ['encrypt','decrypt']);
  });
}
function estChiffre(env){ return !!(env && env.chiffre && env.kdf && env.charge && env.iv); }
function dechiffrer(env, cle){
  return crypto.subtle.decrypt({name:'AES-GCM', iv:b64u8(env.iv)}, cle, b64u8(env.charge))
    .then(function(buf){
      var clair = JSON.parse(new TextDecoder().decode(buf)), res = {};
      for (var a in env) if (a !== 'charge' && a !== 'iv' && a !== 'kdf' && a !== 'chiffre') res[a] = env[a];
      for (var b in clair) res[b] = clair[b];
      return res;
    });
}
function memoriserCle(cle, sel){
  return crypto.subtle.exportKey('raw', cle).then(function(brut){
    try { localStorage.setItem(CLE_CLE, JSON.stringify({sel:sel, cle:u8b64(new Uint8Array(brut))})); } catch(e){}
  });
}
function cleMemorisee(env){
  var m = null;
  try { m = JSON.parse(localStorage.getItem(CLE_CLE) || 'null'); } catch(e){}
  if (!m || !m.cle || !env.kdf || m.sel !== env.kdf.sel) return Promise.resolve(null);
  return crypto.subtle.importKey('raw', b64u8(m.cle), {name:'AES-GCM'}, true, ['encrypt','decrypt'])
    .catch(function(){ return null; });
}
function oublierCle(){ localStorage.removeItem(CLE_CLE); }

/* ---------- pont vers v3.js ----------------------------------------------
   v3.js (export XLSX, réimport, saisie depuis le téléphone) est un fichier
   séparé : index.html ne lui donne que ce dont il a besoin, jamais le mot de
   passe. La clé dérivée est celle déjà mémorisée par le coffre (B4). */
function contexteV3(){
  return {
    enveloppe: enveloppe,
    cle: function(){ return enveloppe ? cleMemorisee(enveloppe) : Promise.resolve(null); },
    b64u8: b64u8, u8b64: u8b64,
    majDonnees: function(d){ data = d; rendre(); },
    donnees: function(){ return data; },
    rendre: function(){ rendre(); }
  };
}

/* ---------- écran de déverrouillage ---------- */
function verrouOuvert(){ return document.getElementById('verrou').classList.contains('on'); }
function montrerVerrou(message){
  var deja = verrouOuvert();
  if (message) document.getElementById('verrou-msg').textContent = message;
  if (deja) return;                       // ne pas effacer une saisie en cours
  document.getElementById('verrou-msg').textContent = message || '';
  document.getElementById('verrou').classList.add('on');
  var champ = document.getElementById('mdp');
  champ.value = '';
  setTimeout(function(){ champ.focus(); }, 60);
}
function masquerVerrou(){
  document.getElementById('verrou').classList.remove('on');
  document.getElementById('mdp').value = '';
  document.getElementById('verrou-msg').textContent = '';
  document.getElementById('btn-verrouiller').style.display = estChiffre(enveloppe) ? 'flex' : 'none';
}
function deverrouiller(){
  var champ = document.getElementById('mdp'), bouton = document.getElementById('btn-ouvrir');
  var mdp = champ.value;
  if (!mdp || !estChiffre(enveloppe)) return;
  bouton.disabled = true; bouton.textContent = 'Déverrouillage…';
  document.getElementById('verrou-msg').textContent = '';
  deriverCle(mdp, enveloppe.kdf.sel, enveloppe.kdf.iterations)
    .then(function(cle){
      return dechiffrer(enveloppe, cle).then(function(d){
        if (document.getElementById('retenir').checked) memoriserCle(cle, enveloppe.kdf.sel);
        else oublierCle();
        data = d; masquerVerrou(); rendre();
      });
    })
    .catch(function(){
      document.getElementById('verrou-msg').textContent = 'Mot de passe incorrect.';
      champ.value = ''; champ.focus();
    })
    .then(function(){ bouton.disabled = false; bouton.textContent = 'Déverrouiller'; });
}
document.getElementById('btn-ouvrir').onclick = deverrouiller;
document.getElementById('mdp').addEventListener('keydown', function(e){ if (e.key === 'Enter') deverrouiller(); });
document.getElementById('btn-verrouiller').onclick = function(){
  oublierCle(); data = null;
  document.getElementById('app').innerHTML = '';
  document.getElementById('app').className = 'skel';
  document.getElementById('pied').innerHTML = '';   // le pied porte des montants : le vider aussi
  montrerVerrou();
};

/* ---------- adoption d'une enveloppe (chiffrée ou non) ---------- */
function adopter(env, memoriser){
  enveloppe = env;
  if (memoriser !== false){ try { localStorage.setItem(CLE_DATA, JSON.stringify(env)); } catch(e){} }
  if (!estChiffre(env)){
    data = env;
    document.getElementById('btn-verrouiller').style.display = 'none';
    masquerVerrou(); rendre();
    return Promise.resolve(true);
  }
  document.getElementById('btn-verrouiller').style.display = 'flex';
  return cleMemorisee(env).then(function(cle){
    if (!cle){ montrerVerrou(); return false; }
    return dechiffrer(env, cle).then(function(d){
      data = d; masquerVerrou(); rendre(); return true;
    }).catch(function(){
      oublierCle(); data = null;
      montrerVerrou('Le mot de passe a changé : saisissez le nouveau.');
      return false;
    });
  });
}

/* ---------- chargement des données ---------- */
function urlsSource(){
  var u = ['./data.json?v=' + Date.now()];
  try {
    var d = enveloppe || JSON.parse(localStorage.getItem(CLE_DATA) || 'null');

/* ==========================================================================
   GRAPHIQUES (SVG construit à la main, aucune bibliothèque)
   ========================================================================== */
function svgEl(n, a){
  var e = document.createElementNS('http://www.w3.org/2000/svg', n);
  if (a) for (var k in a) e.setAttribute(k, a[k]);
  return e;
}
var tipsOuvertes = [];
function infobulle(conteneur){
  var t = el('div', {class:'tip'});
  conteneur.appendChild(t);
  var api = {
    montrer: function(x, y, html){
      tipsOuvertes.forEach(function(o){ if (o !== api) o.cacher(); });
      t.innerHTML = html;
      var l = Math.max(60, Math.min(conteneur.clientWidth - 60, x));
      t.style.left = l+'px'; t.style.top = (y-8)+'px'; t.style.opacity = 1;
    },
    cacher: function(){ t.style.opacity = 0; }
  };
  tipsOuvertes.push(api);
  return api;
}
/* une zone sensible réagit à la souris ET au doigt */
function zoneSensible(zone, montrer, cacher){
  zone.addEventListener('pointerenter', function(e){ if (e.pointerType === 'mouse') montrer(); });
  zone.addEventListener('pointerleave', function(e){ if (e.pointerType === 'mouse') cacher(); });
  zone.addEventListener('pointerdown', function(e){ e.stopPropagation(); montrer(); });
}
document.addEventListener('pointerdown', function(){ tipsOuvertes.forEach(function(o){ o.cacher(); }); });
function echelle(min, max){
  min = Math.min(0, min); max = Math.max(0, max);
  if (max - min < 1e-9) max = min + 1;
  var cands = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
  var meilleur = null;
  [4, 5].forEach(function(n){
    var e = Math.pow(10, Math.floor(Math.log10((max - min) / n)));
    for (var k = 0; k < 2; k++){
      for (var i = 0; i < cands.length; i++){
        var pas = cands[i] * e * (k ? 10 : 1);
        var bas = Math.floor(min / pas) * pas;
        if (bas + n * pas >= max - 1e-9){
          var etendue = n * pas;
          if (!meilleur || etendue < meilleur.etendue - 1e-9)
            meilleur = {bas: bas, haut: bas + n * pas, pas: pas, n: n, etendue: etendue};
          return;
        }
      }
    }
  });
  return meilleur;
}
function indicesEtiquettes(n, maxEtiquettes){
  var s = {};
  if (n <= 0) return s;
  var pas = Math.max(1, Math.ceil(n / maxEtiquettes));
  for (var i = 0; i < n; i += pas) s[i] = true;
  if (n > 1){
    s[n-1] = true;                                   // le dernier point est toujours nommé
    if (pas > 1) for (var j = n-1-Math.ceil(pas/2); j < n-1; j++) delete s[j];
  }
  return s;
}
function fmtAxe(v){
  var a = Math.abs(v);
  if (a >= 1000) return (v/1000).toLocaleString('fr-FR',{maximumFractionDigits:a<10000?1:0})+' k';
  return v.toLocaleString('fr-FR',{maximumFractionDigits:0});
}

/* --- barres groupées : recettes / dépenses par mois --- */
function graphMensuel(hote, mois){
  var W = 680, H = 330, mg = {t:12, r:10, b:30, l:52};
  var pw = W - mg.l - mg.r, ph = H - mg.t - mg.b;
  var ech = echelle(0, Math.max(1, Math.max.apply(null, mois.map(function(m){ return Math.max(m.recettes, m.depenses); }))));
  var max = ech.haut;
  var wrap = el('div', {class:'chart'});
  var svg = svgEl('svg', {viewBox:'0 0 '+W+' '+H, role:'img', 'aria-label':'Recettes et dépenses par mois'});
  var tip = infobulle(wrap);

  for (var i=0;i<=ech.n;i++){
    var y = mg.t + ph - (ph*i/ech.n);
    svg.appendChild(svgEl('line', {x1:mg.l, x2:W-mg.r, y1:y, y2:y, stroke:i===0?'var(--axis)':'var(--grid)', 'stroke-width':1}));
    var tx = svgEl('text', {x:mg.l-7, y:y+3.5, 'text-anchor':'end', class:'axis-label'});
    tx.textContent = fmtAxe(ech.bas + ech.pas*i); svg.appendChild(tx);
  }
  var n = mois.length, bande = pw / n, larg = Math.min(26, (bande-8)/2);
  var etiq = indicesEtiquettes(n, 12);
  mois.forEach(function(m, i){
    var x0 = mg.l + bande*i + bande/2;
    [['recettes','var(--series-1)'],['depenses','var(--series-2)']].forEach(function(s, j){
      var v = m[s[0]], h = Math.max(v>0?1.5:0, ph * v / max);
      var x = x0 - larg - 1 + j*(larg+2);
      if (h > 0){
        var r = svgEl('rect', {x:x, y:mg.t+ph-h, width:larg, height:h, rx:Math.min(4,larg/2), fill:s[1]});
        svg.appendChild(r);
      }
    });
    if (etiq[i]){
      var t = svgEl('text', {x:x0, y:H-8, 'text-anchor':'middle', class:'axis-label'});
      t.textContent = moisCourt(m.mois); svg.appendChild(t);
    }
    var zone = svgEl('rect', {x:mg.l+bande*i, y:mg.t, width:bande, height:ph, fill:'transparent', style:'cursor:pointer'});
    zoneSensible(zone, function(){
      var bb = wrap.getBoundingClientRect(), f = bb.width / W;
      tip.montrer((mg.l+bande*i+bande/2)*f, mg.t*f + 14,
        '<b>'+moisLong(m.mois)+'</b><br>Recettes '+eur(m.recettes)+'<br>Dépenses '+eur(m.depenses)+'<br>Résultat '+eur(m.resultat));
    }, tip.cacher);
    svg.appendChild(zone);
  });
  wrap.appendChild(svg);
  hote.appendChild(wrap);
}

/* --- ligne : cash-flow cumulé --- */
function graphCumul(hote, mois){
  var W = 680, H = 280, mg = {t:14, r:14, b:30, l:56};
  var pw = W - mg.l - mg.r, ph = H - mg.t - mg.b;
  var vals = mois.map(function(m){ return m.cumul; });
  var ech = echelle(Math.min.apply(null, vals), Math.max.apply(null, vals));
  var bas = ech.bas, haut = ech.haut;
  var wrap = el('div', {class:'chart'});
  var svg = svgEl('svg', {viewBox:'0 0 '+W+' '+H, role:'img', 'aria-label':'Cash-flow cumulé'});
  var tip = infobulle(wrap);
  var Y = function(v){ return mg.t + ph - ph*(v-bas)/(haut-bas); };
  var X = function(i){ return mg.l + (mois.length===1 ? pw/2 : pw*i/(mois.length-1)); };

  for (var i=0;i<=ech.n;i++){
    var v = bas + ech.pas*i, y = Y(v);
    svg.appendChild(svgEl('line', {x1:mg.l, x2:W-mg.r, y1:y, y2:y, stroke:'var(--grid)', 'stroke-width':1}));
    var t = svgEl('text', {x:mg.l-7, y:y+3.5, 'text-anchor':'end', class:'axis-label'});
    t.textContent = fmtAxe(v); svg.appendChild(t);
  }
  svg.appendChild(svgEl('line', {x1:mg.l, x2:W-mg.r, y1:Y(0), y2:Y(0), stroke:'var(--axis)', 'stroke-width':1}));

  var d = mois.map(function(m,i){ return (i?'L':'M') + X(i).toFixed(1) + ' ' + Y(m.cumul).toFixed(1); }).join(' ');
  var aire = d + ' L ' + X(mois.length-1).toFixed(1) + ' ' + Y(0).toFixed(1) + ' L ' + X(0).toFixed(1) + ' ' + Y(0).toFixed(1) + ' Z';
  svg.appendChild(svgEl('path', {d:aire, fill:'var(--series-1)', 'fill-opacity':.10}));
  svg.appendChild(svgEl('path', {d:d, fill:'none', stroke:'var(--series-1)', 'stroke-width':2, 'stroke-linejoin':'round', 'stroke-linecap':'round'}));

  var etiq2 = indicesEtiquettes(mois.length, 10);
  mois.forEach(function(m,i){
    var derniere = i === mois.length-1;
    svg.appendChild(svgEl('circle', {cx:X(i), cy:Y(m.cumul), r:derniere?4.5:3, fill:'var(--series-1)', stroke:'var(--surface-1)', 'stroke-width':2}));
    if (etiq2[i]){
      var t = svgEl('text', {x:X(i), y:H-8, 'text-anchor':'middle', class:'axis-label'});
      t.textContent = moisCourt(m.mois); svg.appendChild(t);
    }
    var zone = svgEl('rect', {x:X(i)-pw/(2*Math.max(1,mois.length-1)), y:mg.t, width:Math.max(24,pw/Math.max(1,mois.length-1)), height:ph, fill:'transparent', style:'cursor:pointer'});
    zoneSensible(zone, function(){
      var bb = wrap.getBoundingClientRect(), f = bb.width / W;
      tip.montrer(X(i)*f, Y(m.cumul)*f, '<b>'+moisLong(m.mois)+'</b><br>Cash-flow cumulé '+eur(m.cumul));
    }, tip.cacher);
    svg.appendChild(zone);
  });
  // étiquette directe du dernier point
  var last = mois[mois.length-1];
  var basPlot = Y(last.cumul) > mg.t + ph*0.55;
  var lt = svgEl('text', {x:X(mois.length-1)-8, y:Y(last.cumul)+(basPlot?-10:16), 'text-anchor':'end',
                          'font-size':11, 'font-weight':600, fill:'var(--text-primary)'});
  lt.textContent = eur0(last.cumul); svg.appendChild(lt);
  wrap.appendChild(svg);
  hote.appendChild(wrap);
}

/* --- barres horizontales : top 10 --- */
function graphTop(hote, top){

  ligne(s7, 'Emprunt réellement débloqué', eur(R.recon.deblocage));
  ligne(s7, 'Recettes encaissées', eur(R.recon.recettes));
  ligne(s7, 'Apport personnel', eur(R.recon.apport));
  ligne(s7, 'Total des ressources', eur(R.recon.ressources), true);
  var ecartOk = Math.abs(R.recon.ecart) < 0.005;
  var b = el('div', {style:'margin-top:10px'});
  b.appendChild(el('span', {class:'badge'},
    '<span class="dot '+(ecartOk?'good':'critical')+'">'+(ecartOk?'✓':'!')+'</span>Écart de contrôle : ' + eur(R.recon.ecart) +
    (ecartOk ? ' — emplois et ressources se réconcilient' : ' — vérifiez les paramètres')));
  s7.appendChild(b);
  if (R.recon.capitalRembourse > 0.005){
    s7.appendChild(el('div', {class:'note'},
      'Le capital remboursé (' + eur(R.recon.capitalRembourse) + ') est compté ici dans les emplois : ' +
      'il sort bien de la trésorerie. Le classeur, lui, ne l’intègre pas encore à sa ligne « total des emplois » — ' +
      'son écart de contrôle affichera donc ' + eur(R.recon.ecartClasseur) + ' tant que la formule L15 n’aura pas été complétée.'));
  }
  app.appendChild(s7);

  /* --- section v3 : classeur et saisie (v3.js) --- */
  if (window.SuiviV3) window.SuiviV3.section(app, data, contexteV3());

  /* --- pied : cohérence avec le classeur --- */
  var ec = coherence(R);
  var pied = document.getElementById('pied');
  pied.innerHTML = '';
  var badge = el('span', {class:'badge'},
    !ec.dispo ? '<span class="dot info">i</span>Contrôle avec le classeur indisponible'
      : ec.ok ? '<span class="dot good">✓</span>Chiffres identiques au classeur Excel'
              : '<span class="dot warning">!</span>' + ec.ecarts.length + ' écart(s) avec le classeur');
  pied.appendChild(badge);
  if (ec.dispo && !ec.ok){
    pied.appendChild(el('div', {style:'margin-top:6px'}, esc(ec.ecarts.slice(0,4).join(' · '))));
  }
  var maj2 = data.generated_at ? new Date(data.generated_at) : null;
  pied.appendChild(el('div', {style:'margin-top:6px'},
    'Données publiées le ' + (maj2 ? maj2.toLocaleString('fr-FR') : '?') +
    (data.workbook && data.workbook.modified ? ' · classeur enregistré le ' + new Date(data.workbook.modified).toLocaleString('fr-FR') : '')));
}

/* --- contrôle : les calculs de l'appli == ceux d'Excel ? --- */
function coherence(R){
  var E = data.excel, ecarts = [];
  if (!E) return {ok:true, dispo:false, ecarts:[]};
  function v(nom, got, want){
    if (want === null || want === undefined || want === 'n/a') return;
    if (Math.abs(Math.round(got*100)/100 - want) > 0.011) ecarts.push(nom+' : '+eur(got)+' ≠ '+eur(want));
  }
  v('coût de revient', R.invest.revient, E.cout_revient);
  v('coût total', R.invest.total, E.cout_total_investissement);
  v('apport personnel', R.resultat.apport, E.apport_personnel);
  v('cash-flow', R.resultat.cashflow, E.cash_flow_cumule);
  v('dette restante', R.financement.dette, E.dette_restante);
  v('recettes', R.recettes.total, E.recettes_total);
  v('résultat courant', R.resultat.courant, E.resultat_courant);
  v('emplois', R.recon.emploisClasseur, E.emplois);
  v('mensualité', R.financement.mensualite, E.mensualite_apres_differe);
  v('écart de réconciliation', R.recon.ecartClasseur, E.ecart_reconciliation);
  // séries : mois et détail par nature
  var moisKo = 0;
  (E.mensuel || []).forEach(function(m){
    if (!m[0]) return;
    var g = R.mensuel.filter(function(x){ return x.mois === m[0].slice(0,7); })[0];
    if (!g) return;
    if (Math.abs(Math.round(g.recettes*100)/100 - m[1]) > 0.011 ||
        Math.abs(Math.round(g.depenses*100)/100 - m[2]) > 0.011 ||
        Math.abs(Math.round(g.cumul*100)/100 - m[3]) > 0.011) moisKo++;
  });
  if (moisKo) ecarts.push(moisKo + ' mois en écart');
  var natKo = 0;
  (E.detail_nature || []).forEach(function(d){
    var g = R.detail.filter(function(x){ return x.nature === d[0]; })[0];
    if (!g || d[1] === null) return;
    if (Math.abs(Math.round(g.montant*100)/100 - d[1]) > 0.011) natKo++;
  });
  // le détail n'est comparable que sans filtre (le classeur publie l'état « Toutes / Tous »)
  if (natKo && R.filtres.annee === 'Toutes' && R.filtres.studio === 'Tous') ecarts.push(natKo + ' nature(s) en écart');
  return {ok: ecarts.length === 0, dispo:true, ecarts: ecarts};
}
